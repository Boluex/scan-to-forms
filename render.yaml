# ZERO-BUDGET / FREE-TIER CONTROLLED BETA. Render hosts application services only.
# Neon, Upstash, private R2 and Resend are configured externally; never provision paid resources.
# OCR runs on Ubuntu. Setup and provider limits: docs/RENDER_SETUP.md.
projects:
- name: ScanToForms Beta
  environments:
  - name: Beta
    services:
    - type: web
      name: scantoforms-api
      runtime: docker
      plan: free
      dockerfilePath: ./backend/Dockerfile.render
      dockerContext: .
      healthCheckPath: /health/
      envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_TRUST_PROXY
        value: 'true'
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EXTERNAL_SERVICES_REQUIRED
        value: 'true'
      - key: PROCESSING_MODE
        value: celery
      - key: CELERY_TASK_ALWAYS_EAGER
        value: 'false'
      - key: REDIS_URL
        sync: false
      - key: TEST_DEPLOYMENT
        value: 'true'
      - key: ENABLE_LEGACY_WORKSPACE
        value: 'false'
      - key: ENABLE_PAYSTACK
        value: 'false'
      - key: MANUAL_BANK_TRANSFER_ENABLED
        value: 'true'
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: DIGITIZATION_PRICE_PER_RESPONDENT_NGN
        value: '500'
      - key: SYNTHETIC_PRICE_PER_RESPONSE_NGN
        value: '1000'
      - key: OBJECT_STORAGE_ENABLED
        value: 'true'
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ADDRESSING_STYLE
        value: path
      - key: EMAIL_BACKEND
        value: apps.core.email.ResendEmailBackend
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_TIMEOUT_SECONDS
        value: '15'
    - type: web
      name: scantoforms-web
      runtime: node
      plan: free
      rootDir: frontend
      buildCommand: npm ci && npm run build
      startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
      healthCheckPath: /
      envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DEPLOYMENT_NOTICE
        value: 'Controlled beta: processing runs during operator availability and may
          be delayed. Use non-sensitive test files and keep your originals. Do not
          transfer real money for test orders.'
