# $0 disposable acceptance deployment: every resource must remain on plan free.
# No OCR worker; local media and free Redis are NOT durable. No paid provisioning.
projects:
- name: ScanToForms Beta
  environments:
  - name: Beta
    services:
    - type: web
      name: scantoforms-api
      runtime: docker
      plan: free
      dockerfilePath: ./backend/Dockerfile.render
      dockerContext: ./backend
      healthCheckPath: /health/
      envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_TRUST_PROXY
        value: 'true'
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scantoforms-beta-db
          property: connectionString
      - key: PROCESSING_MODE
        value: celery
      - key: CELERY_TASK_ALWAYS_EAGER
        value: 'false'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scantoforms-redis
          property: connectionString
      - key: TEST_DEPLOYMENT
        value: 'true'
      - key: ENABLE_LEGACY_WORKSPACE
        value: 'false'
      - key: ENABLE_PAYSTACK
        value: 'false'
      - key: MANUAL_BANK_TRANSFER_ENABLED
        value: 'true'
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: DIGITIZATION_PRICE_PER_RESPONDENT_NGN
        value: '500'
      - key: SYNTHETIC_PRICE_PER_RESPONSE_NGN
        value: '1000'
      - key: USE_S3_STORAGE
        value: 'false'
      - key: EMAIL_BACKEND
        value: apps.core.email.ResendEmailBackend
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_TIMEOUT_SECONDS
        value: '15'
      - key: MEDIA_ROOT
        value: /app/media
    - type: keyvalue
      name: scantoforms-redis
      plan: free
      ipAllowList: []
      maxmemoryPolicy: noeviction
      persistenceMode: 'off'
    - type: web
      name: scantoforms-web
      runtime: node
      plan: free
      rootDir: frontend
      buildCommand: npm ci && npm run build
      startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
      healthCheckPath: /
      envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DEPLOYMENT_NOTICE
        value: 'Disposable test deployment: OCR processing is unavailable here. Uploads
          can disappear after restart, redeploy or spin-down. Use non-sensitive test
          files, keep your originals, and do not transfer real money for test orders.'
    databases:
    - name: scantoforms-beta-db
      plan: free
      postgresMajorVersion: '16'
      ipAllowList: []
